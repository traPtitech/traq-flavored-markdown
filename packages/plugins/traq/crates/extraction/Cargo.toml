[package]
name = "markdown-trap-extraction"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
contracts = ["dep:ts-rs", "dep:schemars"]

[dependencies]
markdown-extractor.workspace = true
markdown-trap-contracts = { path = "../contracts" }
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12", optional = true, features = ["serde-json-impl"] }
schemars = { version = "1.2.2", optional = true }

[dev-dependencies]
markdown-ast.workspace = true
serde_json = "1"
