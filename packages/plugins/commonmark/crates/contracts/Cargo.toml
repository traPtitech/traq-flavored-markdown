[package]
name = "markdown-commonmark-contracts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CommonMark node types and shared contract declarations."

[features]
contracts = ["dep:schemars"]

[dependencies]
markdown-ast.workspace = true
markdown-definitions.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }

schemars = { version = "=1.2.3", optional = true }

[dev-dependencies]
markdown-contract-export.workspace = true
serde_json = "=1.0.154"

[[example]]
name = "export-commonmark-types"
path = "examples/export-types.rs"
required-features = ["contracts"]

[lints]
workspace = true
