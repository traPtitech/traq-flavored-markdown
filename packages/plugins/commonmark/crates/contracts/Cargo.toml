[package]
name = "markdown-commonmark-contracts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CommonMark node types and shared contract declarations."

[features]
contracts = ["dep:ts-rs", "dep:schemars"]

[dependencies]
markdown-ast.workspace = true
markdown-definitions.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }

ts-rs = { version = "=12.0.1", optional = true, features = ["serde-json-impl"] }
schemars = { version = "=1.2.2", optional = true }

[dev-dependencies]
serde_json = "=1.0.151"

[[example]]
name = "export-commonmark-types"
path = "examples/export-types.rs"
required-features = ["contracts"]
