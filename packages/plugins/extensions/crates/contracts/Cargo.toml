[package]
name = "markdown-extensions-contracts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Extension node payloads, independent of parsing and rendering."

[features]
contracts = ["dep:schemars"]

[dependencies]
markdown-ast.workspace = true
markdown-definitions.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
schemars = { version = "=1.2.3", optional = true }

[dev-dependencies]
markdown-contract-export.workspace = true
serde_json = "=1.0.154"

[[example]]
name = "export-extensions-types"
path = "examples/export-types.rs"
required-features = ["contracts"]
