[package]
name = "markdown-codec"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Typed Markdown AST JSON boundaries with registered node contracts."

[dependencies]
markdown-ast = { path = "../ast" }
markdown-definitions = { path = "../definitions" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
erased-serde = "0.4.10"
