[package]
name = "markdown-parser"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Typed Markdown parsing mechanics, independent of syntax presets."

[features]
contracts = ["dep:schemars"]

[dependencies]
markdown-ast = { path = "../ast" }
markdown-definitions = { path = "../definitions" }
serde = { version = "=1.0.229", features = ["derive"] }
schemars = { version = "=1.2.2", optional = true }
