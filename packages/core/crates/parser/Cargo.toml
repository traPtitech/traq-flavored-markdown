[package]
name = "markdown-parser"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Typed Markdown parsing mechanics, independent of syntax presets."

[features]
contracts = ["dep:ts-rs"]

[dependencies]
markdown-ast = { path = "../ast" }
markdown-definitions = { path = "../definitions" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", optional = true }
