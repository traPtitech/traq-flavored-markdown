[package]
name = "traq-markdown-wasm"
version.workspace = true
description = "WebAssembly interface for the shared Markdown parser."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
contracts = [
    "dep:schemars",
    "dep:markdown-contract-export",
    "markdown-commonmark-contracts/contracts",
    "markdown-extensions-contracts/contracts",
    "markdown-traq-contracts/contracts",
    "traq-markdown-processing/contracts",
]

[[bin]]
name = "export-node-contracts"
required-features = ["contracts"]

[dependencies]
traq-markdown-features.workspace = true
traq-markdown-processing = { path = "../processing" }
markdown-parser.workspace = true
traq-markdown-grammar = { path = "../grammar" }
markdown-codec.workspace = true
markdown-ast.workspace = true
markdown-contract-export = { workspace = true, optional = true }
markdown-definitions.workspace = true
markdown-commonmark-contracts.workspace = true
markdown-extensions-contracts.workspace = true
markdown-traq-contracts.workspace = true
schemars = { version = "=1.2.3", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[dev-dependencies]
markdown-renderer.workspace = true

[lints]
workspace = true
