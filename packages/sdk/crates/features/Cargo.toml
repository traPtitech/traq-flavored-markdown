[package]
name = "traq-markdown-features"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Typed SDK feature assembly and profile selections."

[features]
default = []
syntax = ["dep:markdown-parser", "dep:markdown-commonmark", "dep:markdown-extensions-syntax", "dep:markdown-traq-syntax"]
text = ["dep:markdown-renderer", "dep:markdown-commonmark-text", "dep:markdown-extensions-text", "dep:markdown-traq-text"]

[dependencies]
markdown-definitions.workspace = true
markdown-commonmark-contracts.workspace = true
markdown-extensions-contracts.workspace = true
markdown-traq-contracts.workspace = true
markdown-parser = { workspace = true, optional = true }
markdown-commonmark = { workspace = true, optional = true }
markdown-extensions-syntax = { workspace = true, optional = true }
markdown-traq-syntax = { workspace = true, optional = true }
markdown-renderer = { workspace = true, optional = true }
markdown-commonmark-text = { workspace = true, optional = true }
markdown-extensions-text = { workspace = true, optional = true }
markdown-traq-text = { workspace = true, optional = true }

[lints]
workspace = true
