[package]
name = "traq-markdown-processing"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
contracts = ["markdown-traq-extraction/contracts", "markdown-traq-contracts/contracts", "dep:schemars"]


[dependencies]
traq-markdown-features = { workspace = true, features = ["text"] }
serde = { version = "=1.0.229", features = ["derive"] }
schemars = { version = "=1.2.3", optional = true }
markdown-traq-contracts.workspace = true
markdown-ast.workspace = true
markdown-commonmark-contracts.workspace = true
markdown-traq-extraction.workspace = true
markdown-renderer.workspace = true
markdown-extractor.workspace = true

[dev-dependencies]
markdown-commonmark-text.workspace = true
markdown-extensions-text.workspace = true
markdown-traq-text.workspace = true
traq-markdown-grammar = { path = "../grammar" }
serde_json = "=1.0.154"

[lints]
workspace = true
