name: Rust and TypeScript CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    defaults:
      run:
        working-directory: commonmark

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: commonmark

      - uses: actions/checkout@v6
        with:
          repository: traq-markdown-parser/core
          path: core

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: actions/setup-go@v6
        with:
          go-version-file: commonmark/go/go.mod
          cache-dependency-path: commonmark/go/go.sum

      - run: cargo test --locked --workspace --all-features
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - run: npm ci && npm run build
        working-directory: core

      - run: npm ci
      - run: npm run generate:bindings

      - run: go -C go test ./...
      - run: git diff --exit-code -- typescript/generated go

      - run: npm run build
      - run: npm run typecheck
