[workspace]
members = [
  "packages/core/crates/ast",
  "packages/core/crates/codec",
  "packages/core/crates/definitions-derive",
  "packages/core/crates/definitions",
  "packages/core/crates/extractor",
  "packages/core/crates/parser",
  "packages/core/crates/renderer",
  "packages/plugins/commonmark/crates/contracts",
  "packages/plugins/commonmark/crates/generic-contracts",
  "packages/plugins/commonmark/crates/generic-syntax",
  "packages/plugins/commonmark/crates/generic-text",
  "packages/plugins/commonmark/crates/syntax",
  "packages/plugins/commonmark/crates/text",
  "packages/plugins/trap/crates/contracts",
  "packages/plugins/trap/crates/extraction",
  "packages/plugins/trap/crates/syntax",
  "packages/plugins/trap/crates/text",
  "packages/traq/crates/grammar",
  "packages/traq/crates/processing",
  "packages/traq/crates/wasm",
  "packages/traq/examples/rust"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
markdown-ast = { path = "packages/core/crates/ast" }
markdown-codec = { path = "packages/core/crates/codec" }
markdown-definitions = { path = "packages/core/crates/definitions" }
markdown-extractor = { path = "packages/core/crates/extractor" }
markdown-parser = { path = "packages/core/crates/parser" }
markdown-renderer = { path = "packages/core/crates/renderer" }
markdown-commonmark = { path = "packages/plugins/commonmark/crates/syntax" }
markdown-commonmark-contracts = { path = "packages/plugins/commonmark/crates/contracts" }
markdown-commonmark-text = { path = "packages/plugins/commonmark/crates/text" }
markdown-generic-contracts = { path = "packages/plugins/commonmark/crates/generic-contracts" }
markdown-generic-syntax = { path = "packages/plugins/commonmark/crates/generic-syntax" }
markdown-generic-text = { path = "packages/plugins/commonmark/crates/generic-text" }
markdown-trap-contracts = { path = "packages/plugins/trap/crates/contracts" }
markdown-trap-extraction = { path = "packages/plugins/trap/crates/extraction" }
markdown-trap-syntax = { path = "packages/plugins/trap/crates/syntax" }
markdown-trap-text = { path = "packages/plugins/trap/crates/text" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
