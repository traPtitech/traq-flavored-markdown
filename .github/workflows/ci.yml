name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  install:
    name: Validate Bun lockfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun ci

  format:
    name: Check formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
          components: rustfmt
      - name: Restore Prettier cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: node_modules/.cache/prettier
          key: prettier-cache-${{ runner.os }}-${{ hashFiles('prettier.config.*', '.prettierignore', 'bun.lock', 'package.json', 'packages/**/package.json') }}
          restore-keys: |
            prettier-cache-${{ runner.os }}-
      - run: bun ci
      - run: bun run prettier --cache --check .
      - run: bun run format:rust:check
      - run: bun run format:go:check

  eslint:
    name: ESLint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Restore ESLint cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .eslintcache
          key: eslint-cache-${{ runner.os }}-${{ hashFiles('eslint.config.*', 'bun.lock') }}
          restore-keys: |
            eslint-cache-${{ runner.os }}-
      - run: bun ci
      - run: bun run lint:check

  typescript:
    name: TypeScript (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - run: bun ci
      - run: bun run check:architecture
      - run: bun run build
      - run: bun run build:corpus
      - run: bun run typecheck
      - run: bun run test:typescript
      - run: bun run test:corpus
      - run: bun run check:package
      - run: bun run check:go-consumer

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - run: cargo test --locked --workspace --all-features
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  go:
    name: Go (${{ matrix.module }})
    strategy:
      fail-fast: false
      matrix:
        module:
          - packages/plugins/commonmark/go
          - packages/core/go
          - packages/plugins/traq/go
          - packages/sdk/go
          - packages/sdk/examples/go
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.0
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        if: matrix.module == 'packages/sdk/go'
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - name: Build SDK Wasm for Go tests
        if: matrix.module == 'packages/sdk/go'
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown -p traq-markdown-wasm
          mkdir -p packages/sdk/dist
          cp target/wasm32-unknown-unknown/release/traq_markdown_wasm.wasm packages/sdk/dist/parser.wasm
      - run: go -C ${{ matrix.module }} test -count=1 ./...

  generated:
    name: Validate generated bindings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - run: bun ci
      - run: cargo fetch --locked
      - run: bun run scripts/build.ts --check-generated
