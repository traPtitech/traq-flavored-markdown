name: Release npm packages

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Validate without committing, tagging, or publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publish
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      id-token: write

    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PUBLISH: ${{ inputs.dry_run == false }}

    steps:
      - name: Require default branch workflow
        if: github.ref_name != github.event.repository.default_branch
        run: |
          echo "Run this workflow from $DEFAULT_BRANCH."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - name: Calculate release version
        run: |
          current_version="$(node -p "require('./package.json').version")"

          if [[ ! "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected a stable SemVer version, got $current_version."
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          case "${{ inputs.release_type }}" in
            major) release_version="$((major + 1)).0.0" ;;
            minor) release_version="$major.$((minor + 1)).0" ;;
            patch) release_version="$major.$minor.$((patch + 1))" ;;
          esac

          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$release_version" >> "$GITHUB_ENV"

      - run: npm install --global npm@11.17.0
      - run: npm --version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt

      - run: bun ci

      - name: Synchronize package metadata with the release tag
        run: bun run release -- "$RELEASE_TAG" --prepare

      - name: Validate shared version and internal dependencies
        run: bun run release -- "$RELEASE_TAG" --check

      - run: bun run check

      - name: Commit release metadata
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          repository_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          release_sha="$(git rev-parse HEAD)"
          git fetch --no-tags "$repository_url" "refs/heads/$DEFAULT_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$release_sha" ]; then
            echo "$DEFAULT_BRANCH changed while the release was being built."
            exit 1
          fi
          if git ls-remote --exit-code --tags "$repository_url" "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Release tag $RELEASE_TAG already exists."
            exit 1
          fi
          git add package.json packages/core/package.json packages/plugins/commonmark/package.json packages/plugins/traq/package.json packages/sdk/package.json bun.lock
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "$RELEASE_VERSION"
          git push "$repository_url" "HEAD:refs/heads/$DEFAULT_BRANCH"

      - name: Release all four packages in dependency order
        run: |
          if [ "$PUBLISH" = true ]; then
            bun run release -- "$RELEASE_TAG" --publish
          else
            bun run release -- "$RELEASE_TAG" --dry-run
          fi

      - name: Tag release commit
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          repository_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
          git push "$repository_url" "refs/tags/$RELEASE_TAG"

      - name: Create GitHub Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
