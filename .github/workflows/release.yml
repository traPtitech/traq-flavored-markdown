name: Release npm packages

on:
  push:
    tags:
      - 'core@*'
      - 'commonmark-plugin@*'
      - 'traq-plugin@*'
      - 'sdk@*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing package tag to release
        required: true
        type: string
      dry_run:
        description: Validate and pack without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.17.0
      - run: npm --version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
          components: clippy,rustfmt
      - run: bun ci
      - name: Validate release label
        run: bun run release -- "$RELEASE_TAG" --check
      - run: bun run check
      - name: Publish package
        run: |
          if [ "$PUBLISH" = true ]; then
            bun run release -- "$RELEASE_TAG" --publish
          else
            bun run release -- "$RELEASE_TAG" --dry-run
          fi
